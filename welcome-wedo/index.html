  <!-- Consent defaults: tracking stays off until the visitor accepts (must run before Tag Manager) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('consent', 'default', {
      ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
      analytics_storage: 'denied', wait_for_update: 500
    });
    try {
      // Saved choice: the shared key is tracking_consent (granted / denied). Older visits used spark-consent.
      var saved = localStorage.getItem('tracking_consent') || localStorage.getItem('spark-consent');
      if (saved === 'granted' || saved === 'denied') {
        if (!localStorage.getItem('tracking_consent')) localStorage.setItem('tracking_consent', saved);
        if (saved === 'granted') {
          gtag('consent', 'update', {
            ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted'
          });
        }
        // Tell Tag Manager about the saved choice before it loads
        dataLayer.push({ event: 'tracking_consent_update', tracking_consent: saved });
      }
    } catch (e) {}
  </script>
