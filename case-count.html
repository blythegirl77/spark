<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Connections sparked</title>
  <link rel="icon" href="/assets/mascot-hero.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Private live counter for the "Who Killed Marketing?" game: total scans of the three suspect pages */
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; padding: 24px; background: #FFFFFF; color: #141414; font-family: 'DM Sans', system-ui, sans-serif; text-align: center; }
    .count { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(96px, 34vw, 240px); line-height: 1; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .label { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(22px, 6vw, 36px); }
    .status { margin-top: 28px; font-size: 13px; color: #555555; }
  </style>
</head>
<body>
  <div class="count" id="count" aria-live="polite">–</div>
  <div class="label">connections sparked</div>
  <div class="status" id="status">Loading…</div>

  <script>
    // Asks the Apps Script web app for the total every 30 seconds.
    (function () {
      var URL = 'https://script.google.com/macros/s/AKfycbyeWHm1OKpKIgedWI3Hc1NwlnSYwPKy1vIF-GIys6JGUEjYF1lH0sQYTh99Vf-9E7A/exec?action=count';
      var countEl = document.getElementById('count');
      var statusEl = document.getElementById('status');
      function time() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
      function load() {
        fetch(URL + '&t=' + Date.now(), { credentials: 'omit' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || typeof d.total !== 'number') throw new Error('no total');
            countEl.textContent = d.total.toLocaleString();
            statusEl.textContent = 'Updated ' + time() + ' · refreshes every 30 seconds';
          })
          .catch(function () {
            statusEl.textContent = 'Couldn’t reach the count at ' + time() + '. Trying again…';
          });
      }
      load();
      setInterval(load, 30000);
    })();
  </script>
</body>
</html>
